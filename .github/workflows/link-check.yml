name: Weekly link check

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC (8 am Mountain)
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Optional: an extra URL to check (use a broken one to test the issue flow)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Check links
        id: check
        continue-on-error: true
        env:
          TEST_URL: ${{ inputs.test_url }}
        run: node scripts/check-links.mjs --report report.md ${TEST_URL:+--test-url "$TEST_URL"}
      - name: Open or update the broken-links issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -f report.md || { echo "Link checker crashed before writing a report"; exit 1; }
          title="Broken links: $(date -u +%F)"
          gh label create broken-links --color d93f0b --description "Found by the weekly link check" 2>/dev/null || true
          num=$(gh issue list --label broken-links --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$title" --body-file report.md
            echo "Updated issue #$num"
          else
            gh issue create --title "$title" --label broken-links --body-file report.md
          fi
      # Broken links are tracked in the issue above, not as a red run. Once a check finds nothing
      # broken, the open issue is closed with a comment. A crash before the report still fails the run.
      - name: Close the broken-links issue when everything passes
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          num=$(gh issue list --label broken-links --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "Link check on $(date -u +%F) found no broken links. $(grep -o 'Blocked or not checked: bot protection ([0-9]*)' report.md || true)"
            echo "Closed issue #$num"
          else
            echo "No open broken-links issue"
          fi
      - name: Summary
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true
